services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: darkwire
      POSTGRES_PASSWORD: darkwire
      POSTGRES_DB: darkwire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkwire"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
